version: 1.0.0
homepage: https://github.com/dansonmaina/danzig_crash_reporter

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  mailer: ^6.1.0
  device_info_plus: ^11.0.0
  package_info_plus: ^8.0.0
  geolocator: ^10.0.0
  intl: ^0.20.0
  shared_preferences: ^2.2.0
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.0